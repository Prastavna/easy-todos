name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Vite+ and dependencies
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Run tests
        run: vp run test

      - name: Build Chrome extension
        run: vp run build:chrome

      - name: Build Firefox extension
        run: vp run build:firefox

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          VERSION=$(node --print "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "chrome_zip=easy-todos-$VERSION-chrome.zip" >> "$GITHUB_OUTPUT"
          echo "firefox_zip=easy-todos-$VERSION-firefox.zip" >> "$GITHUB_OUTPUT"

      - name: Package Chrome extension
        run: zip -r "${{ steps.release.outputs.chrome_zip }}" dist/chrome

      - name: Package Firefox extension
        run: zip -r "${{ steps.release.outputs.firefox_zip }}" dist/firefox

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.tag_name }}
          files: |
            ${{ steps.release.outputs.chrome_zip }}
            ${{ steps.release.outputs.firefox_zip }}
          draft: false
          prerelease: false

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-todos-chrome-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.chrome_zip }}

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: easy-todos-firefox-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.firefox_zip }}
